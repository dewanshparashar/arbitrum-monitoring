<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FleetWatch — Arbitrum Dedicated Chains Fleet Monitor</title>
    <meta
      name="description"
      content="Live operational health for Arbitrum dedicated chains: RPC uptime, bridge TVL, batch-poster cadence, assertion health, retryable tickets and ArbOS versions — one indexed fleet dashboard."
    />
    <meta name="keywords" content="Arbitrum, dedicated chains, fleet monitor, rollup, AnyTrust, RPC uptime, bridge TVL, batch poster, assertion, ArbOS, BoLD" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#080a0f" />
    <link rel="canonical" href="https://fleetwatch.xyz/" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E121B'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2312AAFF' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%233DD68C'/%3E%3C/svg%3E"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FleetWatch" />
    <meta property="og:title" content="FleetWatch — Arbitrum Dedicated Chains Fleet Monitor" />
    <meta
      property="og:description"
      content="Live operational health for Arbitrum dedicated chains: RPC uptime, bridge TVL, batch-poster cadence, assertion health and ArbOS versions — one indexed fleet dashboard."
    />
    <meta property="og:url" content="https://fleetwatch.xyz/" />
    <meta property="og:image" content="https://fleetwatch.xyz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FleetWatch — Arbitrum dedicated chains fleet monitor" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FleetWatch — Arbitrum Dedicated Chains Fleet Monitor" />
    <meta
      name="twitter:description"
      content="Live operational health for Arbitrum dedicated chains — RPC uptime, bridge TVL, batch poster, assertions, ArbOS versions."
    />
    <meta name="twitter:image" content="https://fleetwatch.xyz/og.png" />

    <link rel="stylesheet" href="./ds.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        background: #080a0f;
      }
      #root {
        min-height: 100vh;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideIn {
        from {
          transform: translateX(40px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @keyframes tipIn {
        from {
          opacity: 0;
          transform: translate(-50%, var(--ty, -100%)) scale(0.96);
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- runtime config (apiBase); served no-store per vercel.json -->
    <script src="./config.js"></script>
    <!-- bundled app (esbuild output) -->
    <script src="./app.js"></script>
  </body>
</html>
