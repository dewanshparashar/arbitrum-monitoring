<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbitrum Chains Monitor — Console</title>
    <link rel="stylesheet" href="./ds.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        background: #080a0f;
      }
      #root {
        min-height: 100vh;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideIn {
        from {
          transform: translateX(40px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @keyframes tipIn {
        from {
          opacity: 0;
          transform: translate(-50%, var(--ty, -100%)) scale(0.96);
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- runtime config (apiBase); served no-store per vercel.json -->
    <script src="./config.js"></script>
    <!-- bundled app (esbuild output) -->
    <script src="./app.js"></script>
  </body>
</html>
